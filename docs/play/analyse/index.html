<!DOCTYPE html>

<head>

<body>

<div id="game">

    <div id="boardContainer">
        <div id="boardWrapper">
            <div id="board"></div>
        </div>
    </div>

    <div id="sidebar">

    <div id="panel">
        <p>
            Chess analysis powered in part by
            <a href="https://github.com/nmrugg/stockfish.js">
                Stockfish.js</a>, 
            an open-source project based on Stockfish.
        </p>

        <div id="moves"></div>
        
        <div id="buttons">
            <a href="./?both=true" id="analyseTButtonA">
                <button id="analyseTButton">
                    beide Seiten analysieren
                </button>
                <script>
                    const params = new URLSearchParams(window.location.search);
                    const bothSidesM = params.get("both");
                    const bothSides = bothSidesM === "true" ? true : false;
                    if (bothSidesM === "true") {
                        document.getElementById("analyseTButtonA").innerHTML = "";
                    }
                </script>
            </a>

            <a href="../../home" id="analyseTButtonA">
                <button id="analyseLButton">
                    Analyse verlassen
                </button>
            </a>
        </div>
    </div>

<script>
