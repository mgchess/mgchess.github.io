<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGChess</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: linear-gradient(135deg, #0f0f1b, #1a1a2e);
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 95%;
    max-width: 400px;
    padding: 30px;
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    box-shadow: 0 0 30px rgba(0,255,255,0.2);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
}

.title {
    font-size: 2rem;
    font-weight: bold;
    text-align: center;
    text-shadow: 0 0 10px #00ff88;
    margin-bottom: 10px;
}

/* Kontakt Karten */
.card {
    width: 100%;
    background: #000;
    border-radius: 12px;
    padding: 20px;
    cursor: pointer;
    text-decoration: none;
    color: white;

    display: flex;
    flex-direction: column;
    gap: 12px;

    box-shadow: 0 0 20px #00ff88;
    transition: all .3s ease;
}

.card:hover {
    transform: translateY(-4px) scale(1.02);
    box-shadow: 0 0 30px #00ff88;
}

.card img {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    align-self: center;
    box-shadow: 0 0 15px #00ff88;
}

.card h2 {
    text-align: center;
    font-size: 1.4rem;
    color: #00ff88;
    text-shadow: 0 0 6px #00ff88;
}

.card p {
    text-align: center;
    color: #aaffcc;
    font-size: .95rem;
}

/* Buttons */
.button {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    background: #00ff88;
    color: black;
    font-weight: bold;
    text-align: center;
    box-shadow: 0 0 15px #00ff88;
}

/* Footer */
#lizenz {
    font-size: .9rem;
    color: #aaffcc;
    margin-top: 5px;
    text-align: center;
}

</style>
</head>

<body>

<div class="container">

    <div class="title">
        MGChess
    </div>

    <a class="card" href="https://discord.gg/A2CfAChWs8">
        <img src="../../src/img/logo.png" alt="mgchess Logo">
        <h2>Discord</h2>
        <p>
            Tritt der MGChess Community bei
        </p>
        <div class="button">
            Beitreten
        </div>
    </a>

    <footer id="lizenz">© 2026 mgchess</footer>
</div>

</body>
</html>
