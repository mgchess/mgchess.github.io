<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGChess</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f1115;
    color: white;
}

.container {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
}

.content {
    width: 100%;
    max-width: 500px;
}

h1 {
    margin: 0 0 24px;
    font-size: 32px;
    text-align: center;
}

.card {
    display: block;
    padding: 20px;
    background: #171a21;
    border: 1px solid #2a2f3a;
    border-radius: 12px;
    text-decoration: none;
    color: white;
    transition: .15s ease;
}

.card:hover {
    background: #1d212a;
    border-color: #5865F2;
    transform: translateY(-2px);
}

.card h2 {
    margin: 0;
    font-size: 20px;
}

.card p {
    margin: 8px 0 0;
    color: #aaa;
    font-size: 14px;
}
</style>
</head>

<body>

<div id="topbar"></div>

<div class="container">
    <div class="content">

        <h1>Kontakt</h1>

        <a class="card" href="./discord">
            <h2>Discord</h2>
            <p>Tritt unserem Discord-Server bei.</p>
        </a>

    </div>
</div>

  <script type="module">
    import { loadBar } from "../api/bar.js";
    document.getElementById("topbar").innerHTML = loadBar("..");
  </script>

</body>
</html>
